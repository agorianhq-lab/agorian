<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2E8F1"/><stop offset="1" stop-color="#F1EEE7"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DAD5CB"/><stop offset="1" stop-color="#C9C2B4"/></linearGradient>
    <pattern id="pave" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 7h28M14 0v7M0 7v7M28 7v7" stroke="#B8B0A1" stroke-width="1" fill="none" opacity=".25"/></pattern>
    <style>
      .lbl{font-size:13px;font-weight:700;fill:#1E2436}
      .pill{fill:#FBFAF7;stroke:#DAD5CB}
    </style>
  </defs>

  <!-- sky, hills, mountain -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <circle cx="930" cy="62" r="26" fill="#C7431F" opacity=".9"/>
  <path d="M0 230 Q120 150 260 215 Q330 180 420 220 L420 260 L0 260Z" fill="#4F7F6B" opacity=".35"/>
  <path d="M760 240 L960 110 L1000 140 L1040 110 L1200 240Z" fill="#1F3A5F" opacity=".35"/>
  <path d="M945 122 L960 110 L975 122 Q960 118 945 122Z" fill="#fff"/>
  <path d="M1028 122 L1040 110 L1052 122 Q1040 118 1028 122Z" fill="#fff"/>

  <!-- square paving -->
  <ellipse cx="600" cy="330" rx="640" ry="95" fill="url(#ground)"/>
  <ellipse cx="600" cy="330" rx="640" ry="95" fill="url(#pave)"/>

  <!-- road out of town (right) -->
  <path d="M660 318 Q900 306 1200 316 L1200 340 Q900 332 660 342Z" fill="#B8B0A1" opacity=".9"/>
  <g fill="#8A6B3A"><rect x="960" y="318" width="4" height="12"/><rect x="1060" y="316" width="4" height="12"/><rect x="1160" y="318" width="4" height="12"/></g>

  <g fill="#1E2436" opacity=".08"><ellipse cx="120" cy="262" rx="100" ry="8"/><ellipse cx="245" cy="262" rx="60" ry="7"/><ellipse cx="490" cy="262" rx="36" ry="6"/><ellipse cx="808" cy="292" rx="60" ry="7"/><ellipse cx="920" cy="276" rx="48" ry="6"/><ellipse cx="1130" cy="262" rx="70" ry="8"/></g>
  <!-- ===== MEDIEVAL SIDE ===== -->
  <!-- church -->
  <g>
    <rect x="70" y="170" width="110" height="90" fill="#D9CFC2" stroke="#7A2E2B" stroke-width="2"/>
    <path d="M70 170 L125 135 L180 170Z" fill="#7A2E2B"/>
    <rect x="36" y="120" width="40" height="140" fill="#D9CFC2" stroke="#7A2E2B" stroke-width="2"/>
    <path d="M36 120 L56 60 L76 120Z" fill="#7A2E2B"/>
    <path d="M56 50 v-14 M50 42 h12" stroke="#7A2E2B" stroke-width="3"/>
    <circle cx="125" cy="165" r="10" fill="#CF9A3A" stroke="#7A2E2B" stroke-width="2"/>
    <path d="M115 230 a10 10 0 0 1 20 0 v30 h-20z" fill="#7A2E2B"/>
    <path d="M48 150 a8 8 0 0 1 16 0 v16 h-16z M48 190 a8 8 0 0 1 16 0 v16 h-16z" fill="#7A2E2B" opacity=".6"/>
  </g>
  <!-- castle keep -->
  <g>
    <rect x="200" y="150" width="90" height="110" fill="#CBC1B2" stroke="#7A2E2B" stroke-width="2"/>
    <path d="M200 150 h90 v-16 h-12 v8 h-12 v-8 h-12 v8 h-12 v-8 h-12 v8 h-12 v-8 h-12 v8 h-6z" fill="#7A2E2B"/>
    <rect x="228" y="100" width="34" height="50" fill="#CBC1B2" stroke="#7A2E2B" stroke-width="2"/>
    <path d="M228 100 h34 v-12 h-8 v6 h-8 v-6 h-8 v6 h-10z" fill="#7A2E2B"/>
    <path d="M262 92 l16 -7 l-16 -7z" fill="#C7431F"/>
    <path d="M236 230 a9 9 0 0 1 18 0 v30 h-18z" fill="#7A2E2B"/>
    <rect x="214" y="180" width="8" height="14" fill="#7A2E2B" opacity=".6"/><rect x="268" y="180" width="8" height="14" fill="#7A2E2B" opacity=".6"/>
  </g>
  <!-- market stalls (Practice) -->
  <g>
    <g transform="translate(320 215)">
      <rect x="0" y="22" width="56" height="30" fill="#A8865A"/>
      <path d="M-4 22 L28 -4 L60 22Z" fill="#7A2E2B"/>
      <path d="M4 22 L28 4 L52 22Z" fill="#FBFAF7" opacity=".5"/>
      <rect x="6" y="16" width="44" height="8" fill="#CF9A3A"/>
      <circle cx="14" cy="12" r="5" fill="#C7431F"/><circle cx="26" cy="12" r="5" fill="#4F7F6B"/><circle cx="38" cy="12" r="5" fill="#CF9A3A"/>
    </g>
    <g transform="translate(386 222)">
      <rect x="0" y="22" width="56" height="30" fill="#A8865A"/>
      <path d="M-4 22 L28 -4 L60 22Z" fill="#CF9A3A"/>
      <path d="M8 22 L28 7 L48 22Z" fill="#FBFAF7" opacity=".45"/>
      <rect x="6" y="16" width="44" height="8" fill="#7A2E2B"/>
    </g>
  </g>
  <!-- bell tower (Challenge) -->
  <g>
    <rect x="468" y="110" width="44" height="150" fill="#D9CFC2" stroke="#243A6B" stroke-width="2"/>
    <path d="M468 110 L490 70 L512 110Z" fill="#243A6B"/>
    <circle cx="490" cy="140" r="14" fill="#FBFAF7" stroke="#243A6B" stroke-width="2"/>
    <path d="M490 140 v-9 M490 140 l6 4" stroke="#243A6B" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 180 a10 10 0 0 1 20 0 v18 h-20z" fill="#243A6B" opacity=".25"/>
    <path d="M484 195 a6 6 0 0 1 12 0 v4 h-12z" fill="#CF9A3A"/>
  </g>

  <!-- ===== CENTRE ===== -->
  <!-- bridge (Timeline) -->
  <g>
    <path d="M540 262 Q600 200 660 262" fill="none" stroke="#7A2E2B" stroke-width="10"/>
    <path d="M540 262 Q600 200 660 262" fill="none" stroke="#C7431F" stroke-width="5"/>
    <path d="M540 262 Q600 212 660 262 L660 272 Q600 224 540 272Z" fill="#A8865A"/>
    <g stroke="#C7431F" stroke-width="3" stroke-linecap="round"><path d="M552 256 v-14 M576 240 v-14 M600 232 v-14 M624 240 v-14 M648 256 v-14"/></g>
    <g fill="#CF9A3A"><circle cx="552" cy="240" r="3.5"/><circle cx="576" cy="224" r="3.5"/><circle cx="600" cy="216" r="3.5"/><circle cx="624" cy="224" r="3.5"/><circle cx="648" cy="240" r="3.5"/></g>
    <path d="M500 276 Q600 262 700 276 L700 290 Q600 276 500 290Z" fill="#9FB6D6" opacity=".75"/>
  </g>
  <!-- well (Today's ten) -->
  <g transform="translate(520 318)">
    <ellipse cx="0" cy="44" rx="30" ry="9" fill="#9B9385"/>
    <rect x="-26" y="14" width="52" height="30" fill="#CBC1B2" stroke="#5E5A52" stroke-width="2"/>
    <ellipse cx="0" cy="14" rx="26" ry="8" fill="#1E2436" opacity=".6"/>
    <rect x="-22" y="-20" width="4" height="36" fill="#8A6B3A"/><rect x="18" y="-20" width="4" height="36" fill="#8A6B3A"/>
    <path d="M-32 -20 L0 -40 L32 -20Z" fill="#CF9A3A"/>
    <path d="M0 -20 v18" stroke="#5E5A52" stroke-width="2"/><rect x="-5" y="-4" width="10" height="8" fill="#243A6B"/>
  </g>
  <!-- town crier (Fun facts) -->
  <g transform="translate(700 236)">
    <rect x="-14" y="24" width="48" height="8" fill="#B8B0A1"/><rect x="-8" y="16" width="36" height="8" fill="#C9C2B4"/>
    <circle cx="10" cy="-10" r="7" fill="#E8B99A"/>
    <path d="M2 -2 h16 v18 h-16z" fill="#B8356A"/>
    <path d="M18 2 l10 -8" stroke="#E8B99A" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="-18" width="12" height="16" rx="2" fill="#FBFAF7" stroke="#1E2436"/>
    <path d="M-10 -22 l-6 -4 M-10 -14 l-7 0 M-10 -6 l-6 4" stroke="#B8356A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== EDO SIDE ===== -->
  <!-- bookseller shophouse (Key terms) -->
  <g transform="translate(760 180)">
    <rect x="0" y="30" width="96" height="80" fill="#E8DCC8" stroke="#1F3A5F" stroke-width="2"/>
    <path d="M-8 30 L48 0 L104 30Z" fill="#1F3A5F"/>
    <path d="M-8 30 L104 30" stroke="#1F3A5F" stroke-width="4"/>
    <rect x="10" y="40" width="76" height="26" fill="#4F7F6B"/>
    <path d="M10 40 v26 M29 40 v26 M48 40 v26 M67 40 v26 M86 40 v26" stroke="#E8DCC8" stroke-width="2"/>
    <g><rect x="14" y="80" width="18" height="24" fill="#C7431F"/><rect x="34" y="86" width="18" height="18" fill="#CF9A3A"/><rect x="54" y="78" width="18" height="26" fill="#243A6B"/></g>
  </g>
  <!-- scribe's desk (Paragraph practice) -->
  <g transform="translate(880 214)">
    <path d="M-8 20 L40 -6 L88 20Z" fill="#6B3F7A"/>
    <rect x="2" y="20" width="76" height="40" fill="#E8DCC8" stroke="#6B3F7A" stroke-width="2"/>
    <rect x="12" y="34" width="56" height="18" fill="#A8865A"/>
    <rect x="18" y="28" width="28" height="8" fill="#FBFAF7" stroke="#1E2436"/>
    <path d="M56 22 l10 10" stroke="#1E2436" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- torii -->
  <g fill="#C7431F" transform="translate(975 170)">
    <rect x="6" y="20" width="8" height="90"/><rect x="46" y="20" width="8" height="90"/>
    <rect x="0" y="12" width="60" height="8" rx="1"/><rect x="8" y="34" width="44" height="6"/>
    <path d="M-6 6 Q30 -4 66 6 L64 14 Q30 6 -4 14Z"/>
  </g>
  <!-- castle tower (tenshu) -->
  <g transform="translate(1060 90)">
    <rect x="20" y="110" width="100" height="60" fill="#5E5A52"/>
    <rect x="26" y="70" width="88" height="44" fill="#FBFAF7" stroke="#1F3A5F" stroke-width="2"/>
    <path d="M10 70 Q70 54 130 70 L120 78 Q70 66 20 78Z" fill="#1F3A5F"/>
    <rect x="36" y="34" width="68" height="36" fill="#FBFAF7" stroke="#1F3A5F" stroke-width="2"/>
    <path d="M22 34 Q70 18 118 34 L110 42 Q70 30 30 42Z" fill="#1F3A5F"/>
    <rect x="46" y="6" width="48" height="28" fill="#FBFAF7" stroke="#1F3A5F" stroke-width="2"/>
    <path d="M34 6 Q70 -10 106 6 L98 14 Q70 2 42 14Z" fill="#1F3A5F"/>
    <path d="M62 -6 q8 -10 16 0" stroke="#CF9A3A" stroke-width="3" fill="none"/>
    <g fill="#1F3A5F" opacity=".7"><rect x="44" y="84" width="10" height="12"/><rect x="66" y="84" width="10" height="12"/><rect x="88" y="84" width="10" height="12"/></g>
  </g>

  <!-- labels -->
  <g>
    <rect class="pill" x="330" y="288" width="138" height="24" rx="12"/><text class="lbl" x="399" y="305" text-anchor="middle">Practice · the stalls</text>
    <rect class="pill" x="428" y="78" width="150" height="24" rx="12"/><text class="lbl" x="503" y="95" text-anchor="middle">Challenge · bell tower</text>
    <rect class="pill" x="528" y="176" width="144" height="24" rx="12"/><text class="lbl" x="600" y="193" text-anchor="middle">Timeline · the bridge</text>
    <rect class="pill" x="450" y="372" width="140" height="24" rx="12"/><text class="lbl" x="520" y="389" text-anchor="middle">Today's ten · the well</text>
    <rect class="pill" x="636" y="296" width="150" height="24" rx="12"/><text class="lbl" x="711" y="313" text-anchor="middle">Fun facts · town crier</text>
    <rect class="pill" x="732" y="146" width="152" height="24" rx="12"/><text class="lbl" x="808" y="163" text-anchor="middle">Key terms · bookseller</text>
    <rect class="pill" x="830" y="282" width="180" height="24" rx="12"/><text class="lbl" x="920" y="299" text-anchor="middle">Paragraphs · scribe's desk</text>
  </g>
</svg>
