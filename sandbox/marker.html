<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be the marker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EEE7;--surface:#FBFAF7;--ink:#1E2436;--muted:#636A7A;--line:#DAD5CB;--navy:#243A6B;--accent:#C7431F;--gold:#CF9A3A;--gold-ink:#9A6616;--sage:#4F7F6B;--plum:#6B3F7A;--eu:#7A2E2B;--jp:#1F3A5F;--display:"Fraunces",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151A26;--surface:#1E2434;--ink:#EDEAE3;--muted:#A4A9B6;--line:#343B4E;--navy:#4A5F9E;--accent:#E8694A;--gold:#E2B45C;--gold-ink:#E2B45C;--sage:#6FA58D;--plum:#B58AC4;--eu:#C9736C;--jp:#7FA0D1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:var(--display);font-size:30px;color:var(--navy);margin:0 0 4px}h1 em{color:var(--plum);font-style:italic}
.sub{color:var(--muted);max-width:70ch;margin:0 0 16px}
.tipbox{background:var(--surface);border:2px solid var(--navy);border-left:8px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 18px}
.tipbox ol{margin:6px 0 0;padding-left:20px}.tipbox li{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qt{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.qt:hover{transform:translateY(-2px)}.qt .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.qt.eu{border-left:8px solid var(--eu)}.qt.jp{border-left:8px solid var(--jp)}.qt b{font-size:15.5px;font-family:var(--display)}
.qt .done{font-size:12px;color:var(--sage);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:2px solid var(--navy);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}.btn.quiet{border-color:var(--line);color:var(--muted)}.btn[disabled]{opacity:.5;cursor:default}
.q{font-family:var(--display);font-size:21px;margin:14px 0 4px;color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.ans{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px;position:relative}
.ans h3{margin:0 0 8px;font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;align-items:center}
.ans .mk{display:none;background:var(--gold);color:#1C2333;font-weight:800;border-radius:999px;padding:3px 10px;font-size:14px}
.ans p{margin:0;font-size:15px;white-space:pre-line}
.ans.chosen{outline:3px solid var(--gold);outline-offset:2px}
.ans .pick{margin-top:12px;width:100%}
mark{background:none;color:inherit;border-bottom:0}
.revealed mark{background:color-mix(in srgb,var(--gold) 28%,transparent);border-bottom:2px solid var(--gold-ink);cursor:help;padding:0 1px}
.revealed mark::after{content:attr(data-n);font-size:10px;font-weight:800;color:var(--gold-ink);vertical-align:super;margin-left:1px}
.revealed .ans .mk{display:inline-block}
.notes{display:none;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.revealed .notes{display:block}.notes li{margin:5px 0;padding-left:24px;position:relative}.notes li b{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1C2333;font-size:11px;display:grid;place-items:center}
.why{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;border:2px dashed var(--line)}
.revealed .why{display:block}.why b{display:block;margin-bottom:3px}
.reason{margin-top:14px;background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px;display:none}
.reason.show{display:block}.reason label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:70px;font:inherit;font-size:15px;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.verdict{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;border:2px solid var(--navy);background:var(--surface);font-size:15px}
.revealed .verdict{display:block}.verdict.ok{border-color:var(--sage)}.verdict.no{border-color:var(--accent)}.verdict b{font-family:var(--display);font-size:17px}
.check{display:none;margin-top:14px;background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:12px 14px;font-size:14px}
.revealed .check{display:block}.check ol{margin:6px 0 0;padding-left:20px}.check li{margin:3px 0}
.mine{font-style:italic;color:var(--muted);margin-top:8px;font-size:14px}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
</style></head><body><div class="wrap" id="app"></div><script>
const D={"intro":"Two students answered the same Section C question in fifteen minutes. One scored 4 out of 8, the other 7. Decide which is which and why, before you see the marks. Markers look for the same five things every time; once you can spot them in someone else's answer you will put them in your own.","checklist":["Contention in the first sentence that makes a judgement, not just names the topic","Specific, dated evidence (a year, a name, a place, a law)","A because sentence after each piece of evidence that links it to the question","Says who was affected and how, not only what the rule or event was","A final judgement that weighs (which mattered most, and why)"],"pairs":[{"id":"feudal","unit":"Medieval Europe","q":"Analyse the impact of the feudal system on medieval Europe.","weak":{"marks":4,"text":"[[The feudal system was the way medieval Europe was organised.||First sentence names the topic but makes no judgement. There is no contention to argue for.]] At the top was the king, who owned all the land. He gave land to the barons in return for loyalty and soldiers. The barons gave land to knights, who promised to fight for them for forty days a year. At the bottom were the peasants, who worked the land and gave food to the lord. Serfs were not allowed to leave the manor without permission. [[The feudal system had a big impact because everyone had a place and knew their job.||'Big impact' is not analysis. Which impact? On whom? Compared with what?]] It also meant the king could get an army without paying for one. The Church was also part of the feudal system because it owned a lot of land. [[The feudal system started to end after the Black Death because there were not enough workers.||The one cause-and-effect sentence in the answer, and it is accurate. No date, no law, no event, so it earns a knowledge mark but not an evidence mark.]] [[Overall the feudal system had a big impact on medieval Europe because it affected everyone from the king to the peasants.||The conclusion repeats the question. 'Affected everyone' is true of almost anything and weighs nothing.]]","why":"Accurate description of the pyramid earns knowledge marks, and the Black Death sentence shows some cause and effect. But the answer describes how the system worked rather than analysing what it did, there is not a single date, and nothing is weighed against anything else."},"strong":{"marks":7,"text":"[[The feudal system's greatest impact on medieval Europe was political: it gave kings a way to control a kingdom without a paid army, and that control shaped everything else.||Contention in the first sentence. It answers the question with a judgement ('greatest impact was political') that the rest of the answer has to defend.]] After 1066 William granted England's land to about 180 barons in return for oaths of loyalty and knight service, and [[the Domesday Book of 1086 recorded every holding so the king knew exactly what he was owed.||Dated, specific evidence, and the 'so' clause explains why it matters to the argument.]] This mattered because power now came from land, so a lord who broke his oath could lose everything. Second, feudalism fixed the lives of ordinary people. [[On the manor a serf worked the lord's own fields, paid rent in produce, and needed permission to marry or leave; for a peasant family the system decided where they lived, what they ate and who judged them.||This is the 'so what for people' step. It names a group and says what the system meant for them day to day.]] However, the system's weakness shows its significance just as clearly. [[When the Black Death of 1347 killed around a third of the population, surviving labourers could demand wages, the Statute of Labourers in 1351 tried to freeze them, and anger at that law fed the Peasants' Revolt of 1381.||Three dated events linked in a chain: cause, response, consequence. This is cause and effect shown, not just named.]] [[The feudal system therefore mattered most as a political structure, because when the land-for-service bargain stopped working, the whole order began to break.||Returns to the contention and gives a reason for the ranking.]]","why":"Contention, three arguments with dated evidence, a group of people and what it meant for them, and a judgement that comes back to the question. What keeps it at 7: the final ranking ('mattered most as a political structure') is asserted rather than argued against the social impact the answer itself described, and the change over time in the last paragraph is never named as continuity and change. One more sentence weighing the two impacts would make it 8."}},{"id":"tokugawa","unit":"Shogunate Japan","q":"Analyse how the Tokugawa shogunate kept control of Japan for over 250 years.","weak":{"marks":4,"text":"The Tokugawa shogunate ruled Japan from 1603 to 1868. [[They kept control in lots of ways.||'Lots of ways' is a list announcement, not a contention. The question asks how; a strong answer says which method mattered most.]] [[First, there was sankin kotai, which meant the daimyo had to live in Edo every second year and leave their families there. Second, the Laws for the Military Houses told the daimyo what they could and couldn't do, like building castles. Third, there was the four-class system with samurai at the top, then peasants, artisans and merchants. Fourth, Japan was closed to the world under sakoku so foreign ideas couldn't come in.||Four methods, each named correctly, none explained. Not one 'because' sentence says how the method stopped rebellion.]] Christianity was banned. [[The shogunate also had sword hunts so peasants couldn't have weapons.||A slip. The sword hunt was Hideyoshi's, in 1588, before the Tokugawa. Markers notice.]] [[These things all helped the Tokugawa keep control because the daimyo were watched and the peasants couldn't rebel.||The only explanation in the answer, and it covers all six methods in one sentence.]] [[That is how the Tokugawa kept control for over 250 years.||Restates the question.]]","why":"The knowledge is good: five real Tokugawa policies, correctly named, with the right dates for the period (the sword hunt is Hideyoshi's). That earns 4. But the answer is a list. Nothing is ranked, nothing is explained in its own right, and the marker cannot tell whether the student understands why sankin kotai worked."},"strong":{"marks":7,"text":"[[The Tokugawa kept control for more than 250 years mainly by making rebellion by the daimyo impossible, and only secondly by controlling everyone else.||Contention with a ranking built in: daimyo first, everyone else second. The answer now has a shape.]] The most important tool was sankin kotai, made compulsory in 1635. Every daimyo had to spend alternate years in Edo and leave his wife and heir there permanently. [[This worked in two ways at once: the family was a hostage, and the cost of the processions and two households drained the money a daimyo would have needed for an army.||Explains the mechanism. This is the difference between naming sankin kotai and analysing it.]] The Buke Shohatto of 1615 backed this up by banning new castles and unapproved marriages, [[so the alliances that had torn Japan apart in the century of civil war after 1467 could not form again.||Links the law to a real earlier problem. Shows the student knows why the rule existed.]] Control of ordinary people came second. The four-class system fixed a person's occupation at birth, and sakoku, complete by 1639, cut off the foreign guns and Christian ideas that had unsettled the 1500s. [[For a peasant this meant a lifetime in one village paying rice tax; for a merchant it meant wealth without status.||Two groups, two different experiences of the same system. Perspectives, shown rather than named.]] [[Because the daimyo were the only group with the men and money to overthrow a shogun, the policies aimed at them were the ones that mattered most,||Judgement with a reason.]] which is why the shogunate only fell when outside pressure from Perry in 1853 exposed its weakness.","why":"Ranked contention, mechanisms explained, dated laws, two groups of people and what the system meant for each, and a reasoned judgement. What keeps it at 7: the Perry point at the end is a strong idea dropped in a half-sentence, and the answer never considers how the daimyo themselves saw sankin kotai (a perspective that would strengthen the ranking). Develop either and it is 8."}},{"id":"church","unit":"Medieval Europe","q":"Analyse the influence of the Catholic Church on medieval European society.","weak":{"marks":4,"text":"[[The Catholic Church was very powerful in medieval Europe.||'Very powerful' is a description, not a contention. Powerful in which way, and which way mattered most?]] Everyone was Catholic and went to church. The Church controlled people's lives from birth to death because it did baptisms, weddings and funerals. People had to pay a tithe which was ten percent of what they earned. The Church was also very rich and owned lots of land. Monks lived in monasteries and copied books. [[The Pope was the head of the Church and was even more powerful than kings. He even excommunicated King John in 1209.||A date and a name, which is why this is a 4 and not a 3. But the example is dropped in without saying what happened next or why it mattered.]] People believed that if they did not obey the Church they would go to hell. The Church also started the Crusades. [[In conclusion the Church had a huge influence on medieval society because it controlled religion, money and politics.||Three areas listed, none ranked. The conclusion is a summary, not a judgement.]]","why":"Everything here is true and the answer covers social, economic and political influence, which earns knowledge marks. But the one dated example is not explained, there is no 'because' that links an example to the question, and the conclusion lists instead of weighing."},"strong":{"marks":7,"text":"[[The Church's deepest influence on medieval society was over ordinary people's daily lives, more than its famous power over kings.||A contention that takes a side. It will have to show both kinds of influence and then rank them.]] From baptism to burial, every villager's life ran through the parish church: the year was organised around holy days, the priest was often the only person who could read, and [[doom paintings on the church wall showed exactly what disobedience would cost.||Specific, visual evidence with a purpose attached.]] The tithe, a tenth of every harvest, made the Church the largest landowner in England, holding roughly a quarter of the land. [[For a peasant family this was not abstract: the Church decided when they rested, who they could marry and where their grain went.||'So what for people', done in one sentence.]] The Church's political power was real but less constant. [[When Pope Innocent III excommunicated King John in 1209 and placed England under interdict, closing every church for six years and John eventually gave way, showing that even a king depended on the Church's approval.||Dated example, explained. This is what the weak answer's 'more powerful than kings' needed.]] [[However, that was a dramatic exception, whereas the control of village life was permanent.||The weighing sentence. 'However' and 'whereas' do the analytical work.]] The Church therefore shaped medieval society most through the everyday, because its hold on belief and the calendar reached every person, every week, for centuries.","why":"Contention, both sides of the Church's influence shown with evidence, a named group of people, a dated political example, and an explicit weighing. What keeps it at 7: the claim that political power was 'less constant' rests on a single example, and the answer never asks whether the Church's influence changed across the period (continuity and change). A second political example, or a sentence on change over time, would make it 8."}},{"id":"sakoku","unit":"Shogunate Japan","q":"Analyse the significance of sakoku for Japan.","weak":{"marks":4,"text":"Sakoku means closed country. It was introduced by the Tokugawa shogunate in the 1630s. Under sakoku Japanese people were not allowed to leave Japan and foreigners were not allowed to come in. [[The only country allowed to trade was the Dutch, on the island of Dejima in Nagasaki, and also China.||Correct and specific, but it contradicts 'foreigners were not allowed to come in' without explaining the contradiction. A strong answer uses Dejima to show that sakoku was control, not total closure.]] Christianity was banned and people who were Christians were killed. [[Sakoku was significant because Japan was cut off from the world for over 200 years.||The first 'significant because'. Being cut off is what sakoku was, not what it did.]] This meant Japan did not get new technology like steam ships. When Commodore Perry came in 1853 Japan could not fight back. [[Sakoku was also significant because it kept Japan peaceful.||The best idea in the answer, given one sentence and no evidence. This is where the marks were.]] [[So sakoku was very significant for Japan.||Restates the question with 'very' added.]]","why":"The description of sakoku is accurate and the Perry link shows cause and effect, which earns 4. But the two significances (weakness and peace) are stated, not explained or weighed against each other, and nobody in Japan is mentioned: no samurai, merchant, peasant or daimyo."},"strong":{"marks":7,"text":"[[Sakoku was significant less for what it stopped than for what it allowed: two centuries of peace that changed how Japanese people lived, at the price of military weakness that ended the shogunate.||Contention that sets up both arguments and the judgement between them in one sentence.]] The edicts of 1635 to 1639 banned Japanese from leaving, expelled the Portuguese, and limited foreign contact to the Dutch and Chinese at Nagasaki, [[where Dejima let the shogun control exactly what came in.||Same fact as the weak answer, but explained: Dejima shows sakoku was about control.]] With no foreign wars and no daimyo alliances with outside powers, the peace held. [[Samurai became officials rather than fighters; Edo grew past a million people by 1700; merchants grew rich trading rice while their status stayed at the bottom.||Three groups, each with a changed experience. This is the 'so what for people' step.]] This is why the Edo period produced kabuki, woodblock prints and widespread literacy. However, the same isolation meant Japan missed the industrial changes of the 1700s. [[When Perry's steamships arrived in 1853, Japan had no navy that could answer them, and the humiliation of the 1854 treaty turned samurai against the shogunate within fifteen years.||Dated cause-and-effect chain with the people who reacted named.]] [[Sakoku was therefore most significant as a cause of both the stability of the Edo period and the shock that ended it;||Judgement that holds both arguments together rather than picking one and dropping the other.]] its effects reached from the merchant in Osaka to the daimyo who finally turned on the Tokugawa.","why":"Contention, both significances explained with dated evidence, three social groups, a cause-and-effect chain to 1853, and a judgement. What keeps it at 7: the cultural evidence (kabuki, prints, literacy) is a list with no 'because' linking it to peace, and the ending says the shock 'ended' the shogunate without naming 1868. Fix either and it is 8."}},{"id":"meiji","unit":"Shogunate Japan","q":"Analyse the impact of the Meiji Restoration on Japan.","weak":{"marks":4,"text":"The Meiji Restoration happened in 1868 when the emperor took power back from the shogun. [[It had a big impact on Japan.||No judgement. Which impact, on whom, and compared with what?]] Japan became modern very quickly. [[They built railways and factories and telegraphs. They got a new army with conscription so every man had to serve. The samurai lost their special rights and were not allowed to carry swords. Japan copied the West, with Western clothes and a Western-style constitution in 1889. Japan also sent people overseas to learn. The four class system was ended.||Seven changes in six sentences. All accurate, one dated. None explained, none linked to each other, nobody's experience described.]] [[The Meiji Restoration had a massive impact because Japan went from a feudal country to a modern country in only a few decades and later beat Russia in a war.||The conclusion finally makes a point (speed of change) but proves it with an event from outside the unit, dropped in without explanation.]]","why":"Plenty of correct knowledge and two dates, which earns 4. But the answer is a list of changes with no contention, no mechanism, and no sense that the Restoration affected different people differently. 'Big' and 'massive' are doing the work that analysis should."},"strong":{"marks":7,"text":"[[The Meiji Restoration's greatest impact was on who held power and status in Japan, because the political change of 1868 made every other change possible.||Contention with a reason attached.]] Once the emperor replaced the shogun, the new government abolished the domains in 1871 and replaced daimyo with appointed governors, [[ending the land-for-loyalty system that had organised Japan since the 1100s.||Links the change back across the whole unit. Continuity and change, shown.]] [[The samurai lost most: conscription in 1873 meant commoners now filled the army, the sword ban of 1876 removed their visible status, and their rice stipends were converted to bonds.||A group, three dated changes, and what each one took from them.]] Some rebelled, most famously in 1877, and were crushed by the conscript army, [[which proved the change was permanent.||Uses the rebellion as evidence for the argument rather than just mentioning it.]] [[For commoners the impact was mixed. Compulsory schooling and the end of the class system opened careers that had been closed for 250 years, but new land taxes and factory work in places like the Tomioka silk mill were harsh, especially for young women.||Perspectives: a second group, and a balanced view of their experience.]] Modernisation itself, the railways, telegraphs and the 1889 constitution, mattered, but these were tools; the decisive change was that a warrior class that had ruled for seven centuries was dismantled in under ten years. [[The Restoration therefore mattered most as a transfer of power, and its effects were felt very differently depending on who you were.||Judgement that returns to the contention and names the perspectives idea.]]","why":"Contention, dated evidence throughout, two groups with different experiences, the rebellion used as proof, and a judgement. What keeps it at 7: calling modernisation 'tools' dismisses the strongest counter-argument in half a sentence. One sentence that takes the modernisation case seriously before ranking it second would make it 8."}},{"id":"crusades","unit":"Medieval Europe","q":"Analyse the significance of the Crusades for medieval Europe.","weak":{"marks":4,"text":"The Crusades were wars between Christians and Muslims over the Holy Land. They started in 1095 when the Pope said that anyone who went would have their sins forgiven. The First Crusade captured Jerusalem in 1099. [[There were many more crusades but they mostly failed and Jerusalem was taken back by Saladin.||Accurate but undated. 1187 is the kind of date that turns a statement into evidence.]] [[The Crusades were significant because many people died.||True of every war. Not a significance for medieval Europe.]] They were also significant because they brought back new things to Europe like spices, sugar and new knowledge. Castles got better. The Crusades also made the Pope more powerful. [[Overall the Crusades were very significant for medieval Europe because they changed trade, religion and warfare.||Three areas named in the last sentence, none developed in the body, none ranked.]]","why":"Two correct dates and a fair spread of effects earn 4. But 'significant because' is used three times without any effect being explained, nobody in Europe is named as gaining or losing, and the strongest point (trade and knowledge) gets one sentence."},"strong":{"marks":7,"text":"[[The Crusades mattered most for medieval Europe not as a military success, since they failed, but for the contact and trade they forced open.||Contention that already weighs: military failure against long-term exchange.]] When Urban II called the First Crusade at Clermont in 1095, he offered forgiveness of sins, and the capture of Jerusalem in 1099 seemed to prove God's favour. [[Yet Saladin retook the city in 1187 and the last crusader city, Acre, fell in 1291, so in their own terms the Crusades were a two-century defeat.||Dated evidence with a 'so' that draws the conclusion.]] Their lasting significance was elsewhere. [[Venice and Genoa built trading posts across the eastern Mediterranean, and sugar, spices, silk and paper became regular imports; a merchant in Venice gained far more than any knight.||Names who gained. The comparison with the knight is the 'so what for people' step.]] Contact with Islamic scholarship brought medical texts and the lost works of Greek thinkers like Aristotle into European universities. [[The Church gained prestige at first, but the sack of Christian Constantinople by the Fourth Crusade in 1204 showed how far crusading had drifted from its purpose, and the failures weakened the Pope's claim to lead all Christians.||Change over time within one argument: rose, then fell, with a dated turning point.]] [[The Crusades were therefore significant mainly for the long-term exchange of goods and ideas, which outlasted every kingdom the crusaders founded.||Judgement that returns to the contention with a reason.]]","why":"Contention, four dates, a named group that gained, change over time in the Church's position, and a judgement. What keeps it at 7: the effect on ordinary Europeans who never went east is missing. The Saladin tithe of 1188, or lords mortgaging land to pay for the journey, would show the Crusades reaching the village as well as the merchant. Add that and it is 8."}}]};const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let done={};try{done=JSON.parse(localStorage.getItem('marker')||'{}')}catch(e){}
function save(){try{localStorage.setItem('marker',JSON.stringify(done))}catch(e){}}
function render(t){ let n=0; const notes=[]; const html=t.replace(/\[\[(.+?)\|\|(.+?)\]\]/g,(m,a,b)=>{n++;notes.push(b);return `<mark data-n="${n}" title="${esc(b).replace(/"/g,'&quot;')}">${esc(a)}</mark>`}); return {html, notes}; }
function list(){
 app.innerHTML=`<h1>Be the <em>marker</em></h1><p class="sub">${D.intro}</p>
 <div class="tipbox"><b>What a marker looks for in a Section C answer</b><ol>${D.checklist.map(c=>`<li>${c}</li>`).join('')}</ol></div>
 <div class="grid">${D.pairs.map(p=>`<button class="qt ${p.unit==='Medieval Europe'?'eu':'jp'}" data-id="${p.id}"><span class="eyebrow">${p.unit}</span><b>${esc(p.q)}</b>${done[p.id]?`<span class="done">&#10003; Marked${done[p.id].right?' correctly':''}</span>`:'<span class="eyebrow" style="color:var(--gold-ink)">8 marks &middot; two answers</span>'}</button>`).join('')}</div>
 <p class="foot">Answers are written for this activity. Neither is a real student's work. Marks follow the Section C criteria: structure, historical concepts, knowledge, evidence, expression.</p>`;
 app.querySelectorAll('.qt').forEach(b=>b.onclick=()=>pair(D.pairs.find(p=>p.id===b.dataset.id)));
 window.scrollTo(0,0);
}
function pair(p){
 const flip=Math.random()<.5; const A=flip?p.strong:p.weak, B=flip?p.weak:p.strong; const strongIs=flip?'A':'B';
 const ra=render(A.text), rb=render(B.text); let picked=null;
 app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn quiet" id="back">&larr; All questions</button><span class="eyebrow" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)">${p.unit} &middot; Section C &middot; 8 marks</span></div>
 <p class="q">${esc(p.q)}</p><p class="sub">Read both. One scored 4, the other 7. Pick the stronger one, then say why before the marks appear.</p>
 <div class="two" id="two">
  ${[['A',A,ra],['B',B,rb]].map(([k,x,r])=>`<div class="ans" data-k="${k}"><h3>Answer ${k} <span class="mk">${x.marks} / 8</span></h3><p>${r.html}</p><ol class="notes">${r.notes.map((n,i)=>`<li><b>${i+1}</b>${esc(n)}</li>`).join('')}</ol><div class="why"><b>Why ${x.marks}, not ${x.marks+1}</b>${esc(x.why)}</div><button class="btn pick" data-k="${k}">Answer ${k} is stronger</button></div>`).join('')}
 </div>
 <div class="reason" id="reason"><label for="rt">Why? Name one thing the answer you chose does that the other does not.</label><textarea id="rt" placeholder="For example: it says which impact mattered most in the first sentence."></textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="reveal" disabled>Reveal the marks</button><span class="sub" style="margin:0;font-size:13px">A few words is enough.</span></div></div>
 <div class="verdict" id="verdict"></div>
 <div class="check"><b>Now check the 7 against the list. Can you find all five?</b><ol>${D.checklist.map(c=>`<li>${c}</li>`).join('')}</ol><p class="mine" id="mine"></p></div>
 <div class="row" style="margin-top:16px"><button class="btn" id="next" style="display:none">Next question</button><button class="btn quiet" id="back2" style="display:none">All questions</button></div>`;
 const $=s=>app.querySelector(s);
 $('#back').onclick=list;
 app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{picked=b.dataset.k; app.querySelectorAll('.ans').forEach(a=>a.classList.toggle('chosen',a.dataset.k===picked)); $('#reason').classList.add('show'); $('#reveal').disabled=false; $('#rt').focus()});
 $('#reveal').onclick=()=>{
  const right=picked===strongIs; const txt=$('#rt').value.trim();
  app.classList.add('revealed'); app.querySelectorAll('.pick').forEach(b=>b.disabled=true);
  const v=$('#verdict'); v.className='verdict '+(right?'ok':'no');
  v.innerHTML=right?`<b>Yes. Answer ${strongIs} scored 7.</b> Now look at the numbered notes: the gold phrases are where the marks were earned, and the dashed box under each answer says what separates 4 from 5 and 7 from 8.`
   :`<b>Answer ${strongIs} is the 7.</b> Answer ${picked} reads well and has plenty of correct knowledge, which is what usually draws people to it. But a marker reads for a contention, dated evidence with a because, who was affected, and a judgement. Look at the numbered notes on both answers to see where the marks were earned and lost.`;
  $('#mine').textContent=txt?`Your reason: "${txt}"`:'';
  done[p.id]={right,reason:txt}; save();
  $('#next').style.display=''; $('#back2').style.display='';
  $('#next').onclick=()=>{const i=D.pairs.indexOf(p); app.classList.remove('revealed'); pair(D.pairs[(i+1)%D.pairs.length])}; $('#back2').onclick=()=>{app.classList.remove('revealed'); list()};
  $('#verdict').scrollIntoView({behavior:'smooth',block:'center'});
 };
 window.scrollTo(0,0);
}
list();
</script></body></html>
