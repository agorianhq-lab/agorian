<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unseen sources</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EEE7;--surface:#FBFAF7;--ink:#1E2436;--muted:#636A7A;--line:#DAD5CB;--navy:#243A6B;--accent:#C7431F;--gold:#CF9A3A;--gold-ink:#9A6616;--sage:#4F7F6B;--teal:#2A7A86;--eu:#7A2E2B;--jp:#1F3A5F;--display:"Fraunces",Georgia,serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151A26;--surface:#1E2434;--ink:#EDEAE3;--muted:#A4A9B6;--line:#343B4E;--navy:#4A5F9E;--accent:#E8694A;--gold:#E2B45C;--gold-ink:#E2B45C;--sage:#6FA58D;--teal:#5FB3BF;--eu:#C9736C;--jp:#7FA0D1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:var(--display);font-size:30px;color:var(--navy);margin:0 0 4px}h1 em{color:var(--teal);font-style:italic}
.sub{color:var(--muted);max-width:72ch;margin:0 0 16px}
.tipbox{background:var(--surface);border:2px solid var(--navy);border-left:8px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 18px}
.tipbox ol{margin:6px 0 0;padding-left:20px}.tipbox li{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.st{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:0;overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;transition:transform .12s}
.st:hover{transform:translateY(-2px)}.st .th{height:120px;background:var(--line);display:grid;place-items:center;overflow:hidden}.st .th img{width:100%;height:100%;object-fit:cover}
.st .th.txt{font-family:var(--display);font-size:15px;font-style:italic;color:var(--muted);padding:12px;text-align:center;background:color-mix(in srgb,var(--navy) 8%,var(--bg))}
.st .body{padding:10px 12px}.st .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.st.eu .eyebrow{color:var(--eu)}.st.jp .eyebrow{color:var(--jp)}.st b{font-size:14px;display:block;margin-top:2px}.st .done{font-size:12px;color:var(--sage);font-weight:700;margin-top:4px;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:2px solid var(--navy);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}.btn.quiet{border-color:var(--line);color:var(--muted)}.btn[disabled]{opacity:.5;cursor:default}
.src{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){.src{grid-template-columns:1fr}}
.src img{width:100%;border-radius:8px;border:1px solid var(--line)}
.src blockquote{margin:0;font-family:var(--display);font-size:17px;line-height:1.5;padding:12px 16px;border-left:6px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:0 8px 8px 0}
.cap{font-size:13.5px;color:var(--muted)}.cap b{color:var(--ink)}
.qq{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px;margin-top:12px}
.qq h3{margin:0 0 8px;font-family:var(--display);font-size:16px}
.opts{display:grid;gap:6px}.opt{text-align:left;font:inherit;padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.ok{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,var(--bg))}.opt.no{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.opt[disabled]{cursor:default}.x{display:none;margin-top:8px;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}.x.show{display:block}
.wr{display:none;margin-top:16px}.wr.show{display:block}
.wr .q{font-family:var(--display);font-size:19px;margin:0 0 6px;color:var(--navy)}
.timer{font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy);min-width:70px}.timer.low{color:var(--accent)}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.chk{display:grid;gap:4px;margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}.chk li::before{content:"\2610  ";}
.model{display:none;margin-top:12px;background:var(--surface);border:2px solid var(--sage);border-radius:12px;padding:12px 14px}.model.show{display:block}
.model h4{margin:0 0 6px;font-family:var(--display)}.model ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.self{margin-top:10px}.self select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
</style></head><body><div class="wrap" id="app"></div><script>
const D={"intro":"In the exam, every source comes with a caption and a question you have not seen before. The skill is the same each time: work out what the source is, who made it and why, what it suggests, and what it cannot tell you. Then write a short answer that names the source, adds your own dated knowledge, and goes beyond the obvious. Ten sources here. Four quick questions each, then a timed 3-mark answer.","checklist":["Name the source and point to one detail in it","Add one fact of your own, with a date","Say what the detail suggests, not just what it shows","Go beyond the group or person named in the question"],"sources":[{"id":"bayeux","unit":"Medieval Europe","img":"eu-bayeux","caption":"Scene from the Bayeux Tapestry, an embroidery made in England in the 1070s, probably ordered by Bishop Odo of Bayeux, William the Conqueror's half-brother. The Latin caption reads 'Here King Harold is killed'.","qs":[{"q":"What type of source is this?","o":["A primary visual source, made within a decade of the battle","A secondary visual source, made a decade after the battle","A primary written source, because it has a Latin caption","A secondary source, because it was made for a bishop"],"a":0,"x":"Made in the 1070s about 1066, by people on the winning side. A decade later is still 'at the time' for a medieval source. Written captions on it do not make it a written source."},{"q":"Who most likely wanted this made, and why?","o":["The Normans, to show the conquest as rightful and Harold's death as deserved","The English, to record the loss of their king and the end of their kingdom","The Church, to show that God had punished Harold for breaking his oath","The French king, to show his vassal William winning a great victory"],"a":0,"x":"Odo was William's half-brother and fought at Hastings. The whole work tells the story from the Norman side, including Harold's broken oath. Purpose shapes what a source shows."},{"q":"What does the scene suggest about warfare in 1066?","o":["Mounted knights in mail with kite shields and swords were the striking force","Foot soldiers with long spears were the striking force on both sides","Archers decided the battle and knights played only a small part","Both armies fought mainly on foot with axes and round shields"],"a":0,"x":"The horses, mail coats, long kite-shaped shields and swords are all visible details. 'Suggests' means you read the detail and draw a conclusion from it."},{"q":"What can this source NOT tell you reliably?","o":["How the English saw the battle and what losing it meant for them","Whether the Normans used horses in the fighting at Hastings","What kind of armour and shields a Norman knight carried","Whether Harold died during the fighting at Hastings"],"a":0,"x":"Everything shown is from the winners' point of view. For the English experience you would need a different source, such as the Anglo-Saxon Chronicle."}],"write":"Using the source and your own knowledge, explain why the Battle of Hastings was a turning point for England.","model":"The source shows mounted Norman knights cutting down Harold's army, and the caption says the king was killed, which suggests the English lost their leader and their chance to resist in a single day. Hastings was a turning point because William then replaced the English lords with Normans, recorded every landholding in the Domesday Book of 1086 and imposed feudalism, so ordinary English people now answered to French-speaking lords.","mark":["Source detail named (knights, Harold's death) and what it suggests","Own knowledge with a date (Domesday 1086, Norman lords, castles)","Goes beyond the battle to the change for England and its people"],"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAMQA4QDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABQECAwQGBwAI/8QATRA se it comes from a prayer book","A secondary source, because the owner was not a peasant"],"a":0,"x":"An illumination is a painted picture in a manuscript. It was made in the period it shows, so it is primary and visual."},{"q":"Who made it and for whom, and why does that matter?","o":["An artist for a rich patron, who did not share the peasants' life","Peasants for their own village, so it shows the harvest as they saw it","A monk for a monastery, so it shows the Church's view of hard work","The king's clerks for the Domesday survey, so it records the harvest"],"a":0,"x":"Psalters were expensive prayer books for the wealthy. The scene is how the landowning class pictured the people who worked their land, which affects what it shows and leaves out."},{"q":"What does the detail of the reeve with a stick suggest?","o":["Peasants' labour on the lord's land was supervised and could be enforced","The reeve was the oldest peasant and led the others by example","Peasants worked whenever they chose and the reeve kept the time","The reeve was a soldier guarding the field from thieves"],"a":0,"x":"The reeve was the lord's manager. Standing over the workers with a stick suggests obligation and control, not free labour. That is an inference from a detail."},{"q":"Which question can this source NOT answer on its own?","o":["How the peasants felt about the work they were doing","That reaping was done by hand using sickles","That the workers wore simple tunics and hoods","That a supervisor stood over the workers"],"a":0,"x":"The picture shows bodies, tools and a supervisor. Feelings are not visible; to say peasants resented it you would need a written source or your own knowledge of the 1381 revolt."}],"write":"Using the source and your own knowledge, explain what the source suggests about the lives of peasants on a medieval manor.","model":"The source shows peasants cutting grain with sickles while a reeve stands over them with a stick, which suggests their labour on the lord's l without consent","King John, to win back the barons' loyalty after losing Normandy","The Pope, to punish John for refusing the new archbishop","The free peasants, to win protection from their lords' courts"],"a":0,"x":"John had lost Normandy, raised heavy taxes and punished barons without trial. The barons rebelled and made him seal the charter. The purpose tells you whose interests it protects."},{"q":"What does the clause suggest about the king's power?","o":["The king was now expected to act under the law rather than above it","The king could still do as he wished but had to explain why","The barons had taken over the king's courts and judges","The law of the land was now written down for the first time"],"a":0,"x":"'Lawful judgement' and 'law of the land' put a limit on the king's actions. That is a change from the idea that the king's will was law."},{"q":"Which detail shows the limit of this clause?","o":["'Free man' excluded serfs, who were most of the population","'Lawful judgement' left the king free to decide what was lawful","It only applied in the parts of England the barons controlled","It mentions exile, which the king had never used"],"a":0,"x":"Most English people in 1215 were unfree. The charter protected barons and freemen, not the peasants on the manor. Noticing who is left out is a mark-earning skill."}],"write":"Using the source and your own knowledge, explain how Magna Carta shows a change in the power of the king.","model":"The clause says no free man can be punished 'except by the lawful judgement of his equals or by the law of the land', which suggests the king could no longer act on his will alone. This was a change because John had taxed and punished barons without trial after losing Normandy in 1204, so in 1215 they forced him to seal the charter. However, serfs, the majority, were not 'free men' and gained nothing.","mark":["Quotes a phrase and says what it suggests","Own knowledge with a date (Normandy 1204, Runnymede 1215, the barons' revolt)","Goes beyond the barons to note who the clause did not protect"]},{"id":"siena","unit":"Medieval Europe","text":"The deaths began in Siena in May. It was a cruel and terrible thing. Fathers abandoned their children, wives their husbands and brothers each other, because people believed the sickness passed through breath and sight. Nobody could be found to bury the dead, for money or for friendship. I buried five of my own children with my own hands.","caption":"Adapted from the chronicle of Agnolo di Tura, a shoemaker and tax collector in Siena, Italy, writing about the plague of 1348.","qs":[{"q":"What type of source is this?","o":["A primary written source: an eyewitness account from the time","A secondary written source: a later historian's description","A primary source, but an official death register not a chronicle","A secondary source, because it was written in Italian"],"a":0,"x":"A chronicle written by a man who lived through the event is primary and written. His job as a tax collector also means he was used to recording things."},{"q":"Why is the writer's own loss important for how you use the source?","o":["It makes him a true witness to suffering, but may colour his view of others","It means the source is unreliable and should not be used at all","It shows he was a doctor who understood how the plague spread","It proves that the plague began in Siena before anywhere else"],"a":0,"x":"Grief gives the account power and truth about what the plague felt like. It may also make his claims about everyone abandoning everyone sound more total than they were. Say both."},{"q":"What does 'nobody could be found to bury the dead' suggest?","o":["Normal community and religious customs collapsed under the scale of death","The city council had banned burials to stop the sickness spreading","Siena's cemeteries were full and new ones were not yet built","People in Siena had stopped believing in the Church"],"a":0,"x":"In a Catholic society, proper burial mattered enormously. That it could not be bought or asked of friends suggests the number of deaths overwhelmed the normal order."},{"q":"What can this source NOT tell you?","o":["How many people died across Europe as a whole","That the writer lost five children to the plague","That people believed the sickness spread by breath and sight","That the plague reached Siena in the spring of 1348"],"a":0,"x":"One man in one city cannot give the European figure. For the estimate of around a third of the population you need historians' work, which is your own knowledge."}],"write":"Using the source and your own knowledge, explain the impact of the Black Death on medieval communities.","model":"Agnolo di Tura writes that families abandoned each other and 'nobody could be found to bury the dead', which suggests fear broke the normal bonds of family and religion; burying five of his own children shows the scale in one household. Across Europe the plague of 1347 to 1351 killed about a third of the population, and the shortage of workers let labourers demand wages, leading to the Statute of Labourers in 1351 and the revolt of 1381.","mark":["Quotes the source and infers (bonds broke down, scale of death)","Own knowledge with dates (a third of Europe, 1351, 1381)","Goes beyond Siena to the wider social and economic change"]},{"id":"mongol","unit":"Shogunate Japan","img":"f-mongol","caption":"The samurai Takezaki Suenaga on his wounded horse during the first Mongol invasion of 1274, from the Mongol Invasion Scrolls, Japan, around 1293. Suenaga had the scrolls made himself.","qs":[{"q":"What type of source is this?","o":["A primary visual source: a painted scroll made soon after the invasions","A secondary visual source: a later artist imagining the invasions","A primary written source, because the scroll has captions","A secondary source, because Suenaga did not paint it himself"],"a":0,"x":"Painted about twelve years after the 1281 invasion, by order of a man who fought in it. Primary and visual."},{"q":"Why did Suenaga have the scrolls made?","o":["To record his own deeds so he could claim a reward from the shogunate","To warn the shogunate that the Mongols would return a third time","To thank the gods for the storm that wrecked the Mongol fleet","To teach young samurai in his family how to fight on horseback"],"a":0,"x":"Suenaga travelled to Kamakura to argue he deserved land for his bravery. The scrolls are his evidence. This is why he is always at the centre of the action."},{"q":"What does the detail of the wounded, bleeding horse suggest?","o":["Suenaga wanted to show he had fought at close range and risked his life","Suenaga's horse was old and fell during a peaceful parade","Samurai preferred to fight on foot and used horses only to travel","Mongol soldiers used horses but the samurai did not"],"a":0,"x":"Suenaga is shown alone, under fire, his horse struck by arrows. Every detail says 'I was in the thick of it'. That is the inference, and it is exactly what a man claiming a reward would want painted."},{"q":"What should make you careful about using this source?","o":["He paid for it to look brave, so his own role may be exaggerated","It was painted in Japan, so it cannot show the Mongol side","It shows horses, which the Mongols did not bring to Japan","It is very old, so the colours can no longer be trusted"],"a":0,"x":"Purpose shapes content. A source made to win a reward will put its owner in the best light. It is still useful for what a samurai wore and rode."}],"write":"Using the source and your own knowledge, explain why the Mongol invasions weakened the Kamakura shogunate.","model":"The scroll shows Suenaga alone on a wounded horse, and he had it painted to prove he deserved a reward, which suggests samurai expected land in return for fighting. The invasions of 1274 and 1281 were beaten off, partly by the typhoon the Japanese called the kamikaze, but no enemy land was won, so the shogunate had nothing to give the samurai who had fought. Unpaid, resentful warriors stopped trusting it, which helped its collapse in 1333.","mark":["Detail and purpose of the source used to infer (land for service)","Own knowledge with dates (1274, 1281, kamikaze, 1333)","Goes beyond the battle to the system of reward and its failure"],"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCANLA4QDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACAwQFBgf/xABMEAABAwMCBAQEBQMDAwMBAREBAgMRAAQhEjEFQVFhEyJxgTKRobEGFMHR8CNC4VJi8RUzciSCkkOyFqLC0gclNERjc5PiNUVTZIP/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QALBEBAQACAgIBBQACAgICAwAAAAECEQMhEjFBBBMiUWEycUKBFJFSsSPB4f/aAAwDAQACEQMRAD8A7GDzP12on1+tBR6zO1JM9PlXgekRHc+po4zAk/egogSYNROXAHwJnvNBKopgExAyMVGpxB2JJ7VWW4VrEgyfamKcSBEGRRFlbwSCEqE+lVbm7GlRBHPJzUbj6dRK5CN84rMubsulQThIncbVYi8jiqUOArJUg7kKyB6VSC3HV/00FUnr3pBlrWQfcRzq9buNMtQYAwRit5M4pWbdZE+GlpOmFadz1mamUUtJnHcE1XdvCUHw0lROxV+1U1FTq1a3FHsKy1tYfvowkydsjFVlB1xMrUqSNpqG+ZU5bKaQsNLJBBkiIOIishVpxVGG7xRCtv6qv1olrZUUoyqATyigXSoADH861jFni4yl5a43Jc2+dGOLCCVrVg41Iq6TbUWtSVwVHV3xQKyCM71m6+LDTqQ5B5hKTQL/ABPYsOz18H9qaNtWF6RIxvgUQJg6iYOysQayDfcSREsKHqyRTRxa9QAVoQCeqCKaNt0AHKZMHMCYqZDgTCXAT6Zrnz+IHyEy2zqyTgj9aI/ELwA1MNEDoo4qaXcdIlaZEAxMZp5dA3VA6RXNHjzoSJtwQdvMaenj6QkFdqf/AJj9qaq7jdVcFQ8m2RNAOEyCVEDrWGv8QJJhDC8HckGPQVErjPiqhaHczAEVNVZY3VXCAn/uJn/bUf5mSUttlX+5ZrHRxW1SR/RcHeAf1qyeL2Ta8lYJSDlMxzzFNVfLGLpDzkBS8dEin+EkAeWI5ms7/rVqQZdKRv8AARFIcTsnDBuh0yCB9sVdM3PbRLiYwCcHJqVLgLRKUxjJ2rOF5aBMm6a9NWab+ftwfK4lU89QihJb6ahfAIMSOeKBUgZUsgb551nC71eRtwEkbJNSNWz75EJUrO6f3rNrtjxW92rK7hmCEJ1kCek003bhT5EpR6CSKkZ4U84jVBSMZ3MVaFgw2kKdKY5a1R9BU7rc+3h/We0h66MDWpU+UCraOE3KlDWUpTH9yoirwet2W/8AvNIT/pQIPyifnVY8TaGrSFdiTv8AWp4pef8A+MSp4VaoVK3VKj/SN6soZYbP9O2R6qBURWceJuRLaUjqDmq6rx9QGp0gT/aYIrXi5Xkyvut1y6WBnSgdBVZV2DEn51ntuFSQCCuKsNoJhQxI2Iq6YSrulkYTmOQqLxlH41H54qZNsMaiB/4ipUMspyfrUFZKlKXiemRUqW aimyo must not shelter men who have plotted rebellion or committed crimes in another domain.","caption":"Adapted from the Buke Shohatto (Laws for the Military Houses), issued by the Tokugawa shogunate in 1615, shortly after the fall of Osaka Castle.","qs":[{"q":"What type of source is this?","o":["A primary written source: a law code issued by the government of the time","A secondary written source: a description of the laws by a historian","A primary written source, but a private letter from a daimyo","A primary visual source showing the shogun's court"],"a":0,"x":"A set of laws issued in 1615 by the shogunate is an official primary written source."},{"q":"Why did the shogunate issue these laws in 1615?","o":["Ieyasu had just destroyed the last Toyotomi stronghold and wanted no daimyo ever able to challenge the Tokugawa","The shogunate had just lost Osaka Castle and wanted every daimyo to rebuild his army and castles","Having just made peace with the Mongols, the shogunate wanted samurai to return to study","Having just opened trade with the Dutch, the shogunate wanted daimyo to marry foreigners"],"a":0,"x":"Osaka Castle fell in 1615, ending the last serious rival. The timing shows purpose: lock in Tokugawa control while the daimyo were weak."},{"q":"What does the rule on marriages suggest?","o":["Marriage was a way daimyo built alliances, and the shogunate wanted to control that","Marriage between daimyo families was rare and the shogunate wished to encourage it","The shogunate wanted every daimyo to marry into the Tokugawa family","Marriages were costly and the shogunate wanted daimyo to save money"],"a":0,"x":"Alliances through marriage had fuelled the civil wars of the 1400s and 1500s. Controlling marriages controlled alliances. That is an inference from a rule."},{"q":"What does this source NOT tell you?","o":["Whether the daimyo obeyed the laws, or how they felt about them","That building new castles was forbidden by the shogunate","That samurai were expected to study as well as train","That the laws were issued by the shogunate, not the emperor"],"a":0,"x":"A law tells you what the government wanted. Whether it worked needs other evidence, such as the 250 years of peace that followed, which is your own knowledge."}],"write":"Using the source and your own knowledge, explain how the Tokugawa shogunate used laws like this to control the daimyo.","model":"The law bans new castles and private marriages between daimyo families, which suggests the shogunate feared the alliances and fortresses that had let daimyo fight each other in the civil wars. Issued in 1615, just after Osaka Castle fell, it was backed in 1635 by sankin kotai, which kept daimyo families in Edo and drained daimyo money, so for over two centuries no daimyo had the castles, allies or funds to rebel.","mark":["Names a rule from the source and infers its purpose","Own knowledge with dates (1615 Osaka, 1635 sankin kotai)","Goes beyond the law to its effect on daimyo and on Japan"]},{"id":"dejima","unit":"Shogunate Japan","img":"f-dejima","caption":"A Dutch ship arriving at Dejima, painted by Kawahara Keiga, a Japanese artist in Nagasaki who worked for the Dutch traders, around 1811.","qs":[{"q":"What type of source is this?","o":["A primary visual source: a painting made at the time by someone who saw the scene","A secondary visual source: a later painting based on written descriptions","A primary written source, because the painting records a date","A secondary source, because the artist worked for foreigners"],"a":0,"x":"Keiga lived in Nagasaki and painted what the Dutch asked him to record. A painting from the time, of the time, is primary and visual."},{"q":"Why does it matter that the artist worked for the Dutch?","o":["He had rare access to Dejima, but painted what his Dutch clients wanted","He had no access to Dejima, so he painted the ship from imagination","He was Dutch himself, so he saw Japan as a foreigner would","He was paid by the shogunate, so he painted what the government wanted"],"a":0,"x":"Few Japanese could see Dejima up close. That makes Keiga valuable. But a painter working for clients shows what the clients want, so purpose still matters."},{"q":"What does the arrival of a single foreign ship, watched by onlookers, suggest about sakoku?","o":["Foreign contact was rare and controlled, so a ship's arrival was an event","Japan traded freely with all nations and ships arrived every day","The Dutch had taken over Nagasaki and the crowd had come to protest","Japanese people were forbidden to look at foreign ships"],"a":0,"x":"Under sakoku only the Dutch and Chinese could trade, and only at Nagasaki. One ship a year or so was worth painting. The crowd suggests curiosity, not hostility."},{"q":"What can the source NOT show you?","o":["What the shogunate thought of foreign ideas, or how Dutch goods spread","That ships from the Netherlands reached Nagasaki harbour each year","That Japanese people gathered to watch the arrival","That the Dutch had a trading post in the harbour"],"a":0,"x":"A harbour scene shows a moment in one place. The policy behind it and the spread of Dutch learning (rangaku) across Japan come from your own knowledge."}],"write":"Using the source and your own knowledge, explain the significance of Dejima for Japan under sakoku.","model":"The painting shows one Dutch ship arriving while Japanese onlookers watch, which suggests foreign contact was rare enough to be an event and was kept to a single place. After the sakoku edicts of the 1630s Dejima was the only point where Western goods and knowledge, called rangaku, could enter Japan, so while sakoku kept Christianity and foreign armies out, Japan was never completely closed, which helped it respond to the West after 1853.","mark":["Detail named (one ship, onlookers) and what it suggests","Own knowledge with dates (1630s edicts, rangaku, 1853)","Goes beyond the harbour to Japan as a whole"],"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAA niform to every school was a way of making him the face of modernisation."},{"q":"What do the uniform, short hair and chair suggest?","o":["The Meiji government wanted Japan to look like a modern Western power","The emperor had been forced to join a foreign army after 1868","Japan had been conquered and its emperor made to wear foreign dress","The government had banned traditional dress for all Japanese men"],"a":0,"x":"Each detail is a deliberate choice: the Western uniform, the European-style haircut, the posed seat. Read them together and the message is 'modern and equal to the West'."},{"q":"What does the source NOT tell you?","o":["How ordinary Japanese people felt about the changes","That the emperor was photographed in a Western uniform","That the photograph was taken in the year 1873","That the government used images of the emperor to spread its message"],"a":0,"x":"A staged official portrait shows the government's message, not the public's reaction. For how samurai or peasants felt you need other sources or your own knowledge of the 1877 rebellion and tax protests."}],"write":"Using the source and your own knowledge, explain what the photograph suggests about the aims of the Meiji government.","model":"The emperor wears a Western military uniform with short hair and sits on a European chair, which suggests the government wanted Japan to be seen as a modern nation equal to the West. After 1868 it introduced conscription in 1873, the year of this photograph, and built railways and telegraphs. Sending the image to schools also shows it wanted ordinary people to be loyal to the emperor rather than to their old daimyo.","mark":["Details named (uniform, hair, chair) and what they suggest","Own knowledge with dates (1868, 1873 conscription, Iwakura Mission)","Goes beyond the emperor to what the government wanted from ordinary people"],"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7P  the oath issued at this moment?","o":["The new government had just taken power from the shogun and needed support and a direction","The emperor had just declared war on the Western powers and needed soldiers","The shogun had just been restored and wanted to reassure the daimyo","The government had just banned all foreign trade and wanted to explain why"],"a":0,"x":"The shogun had resigned in late 1867 and fighting continued into 1868. An oath promising discussion, unity and knowledge was a way of reassuring the daimyo, samurai and commoners."},{"q":"What does article 3 suggest about the Tokugawa period?","o":["The class system had fixed people's work by birth and caused resentment","Commoners had always chosen their own work and the oath confirmed it","Warriors were to lose all their rights on the day the oath was sworn","Officials were to be sent to the countryside to become farmers"],"a":0,"x":"Saying commoners 'shall be allowed' to follow their own callings implies they were not before. The four-class system had fixed status by birth for over 250 years."},{"q":"What does the oath NOT tell you?","o":["Whether the promises were kept, or how quickly","That the emperor wanted knowledge sought from abroad","That the oath promised assemblies and open discussion","That the oath was sworn in April 1868"],"a":0,"x":"Aims are not outcomes. The first elected assembly, the Diet, did not meet until 1890. Checking a promise against what happened is where your own knowledge earns marks."}],"write":"Using the source and your own knowledge, explain how the Charter Oath marked a break from the Tokugawa period.","model":"The oath promises that 'all classes, high and low' will share in government and that 'knowledge shall be sought throughout the world', which suggests a rejection of the fixed four-class system and of sakoku. The government acted on this: domains were abolished in 1871 and commoners conscripted from 1873. However, the promised assemblies did not meet until the Diet of 1890, so the break came faster for samurai, who lost status, than for commoners.","mark":["Quotes the oath and infers what it rejects","Own knowledge with dates (1871, 1873, 1890)","Goes beyond the promise to who gained and lost, and how fast"]},{"id":"samurai","unit":"Shogunate Japan","img":"jp-samurai","caption":"Studio photograph of a samurai in full armour, Japan, 1860s, photographer unknown. Photographs like this were sold to foreign visitors in Yokohama.","qs":[{"q":"What type of source is this?","o":["A primary visual source: a photograph taken in the period","A secondary visual source: a later painting copied from a photograph","A secondary source, because the photographer is unknown","A primary written source, because the studio kept records"],"a":0,"x":"Taken in the 1860s of a man of the 1860s. Not knowing the photographer's name does not make it secondary; it just means you say 'photographer unknown' when you name the origin."},{"q":"Why was it made, and why does that matter?","o":["To sell to foreigners wanting an 'exotic' samurai, so the pose is staged","To record a samurai before a battle, so the armour is what he fought in","As an official government portrait, so it shows what the state wanted","To train new soldiers, so it shows the correct way to hold a sword"],"a":0,"x":"By the 1860s full armour was ceremonial; samurai did not walk about dressed like this. A souvenir photograph shows what the buyer expected, which is a purpose to name."},{"q":"What does the photograph suggest about samurai identity in the 1860s?","o":["Armour and swords were still symbols of status, though samurai rarely fought","Samurai were constantly at war in the 1860s and wore armour daily","Samurai had already given up their swords by the time of the photograph","Samurai had adopted Western uniforms but kept their helmets"],"a":0,"x":"Two centuries of peace had made samurai officials, but the armour and two swords remained the marks of their class. The photo preserves the symbol, not the daily reality."},{"q":"What can it NOT show you?","o":["What happened to samurai after 1868, or how this man actually lived","That samurai carried two swords as a mark of their class","That full armour was still owned and worn in the 1860s","That photography had reached Japan by the 1860s"],"a":0,"x":"A single staged moment cannot show the decade that followed: conscription in 1873, the sword ban in 1876 and the loss of stipends. That is your own knowledge to add."}],"write":"Using the source and your own knowledge, explain how the position of the samurai changed in the years after this photograph was taken.","model":"The photograph shows a samurai in full armour with his swords, which suggests these were still proud symbols of a warrior class, even though after 250 years of peace most samurai worked as officials. Within fifteen years the Meiji government introduced conscription in 1873, banned swords in 1876 and ended samurai stipends. Some rebelled in 1877 and were crushed by the conscript army, which shows the change was permanent.","mark":["Details named (armour, swords) and what they suggest","Own knowledge with dates (1873, 1876, 1877)","Goes beyond this one man to the whole class and what became of them"],"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAOEAmQDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAShAAAQQBAwIFAgUCBAQFAgAPAQACAxEEBRIhMUEGEyJRYTJxBxSBkaEjQhVSscEkM2LRFkNy4fGC8CVTshc0Y3OSosI1RGSTw//EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAJBEBAQEBAAIDAAIDAQEBAAAAAAERAiExAxJBMlETIkJhIzP/2gAMAwEAAhEDEQA/APZkIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEIQgEJEWgVJwoZsyCAet4v2HJVGbVjQMTNo93c/wpbizm1qKKXJhiFvlaP1WHJmTv+uYkew4CgL+/us/Z0nx2tp2qQC9rXH2sVarv1aR30Maw/wDVZ/7LN862kd+yYHk91n7VufHGgdSyHdXhv/pCjdlzv4Mrz+qqtkDjyeiDKAT7JtX6xP5zr9T3H/6ik let tick=null;
function list(){
 clearInterval(tick);
 app.innerHTML=`<h1>Unseen <em>sources</em></h1><p class="sub">${D.intro}</p>
 <div class="tipbox"><b>The 3-mark checklist</b><ol>${D.checklist.map(c=>`<li>${c}</li>`).join('')}</ol></div>
 <div class="grid">${D.sources.map(s=>`<button class="st ${s.unit==='Medieval Europe'?'eu':'jp'}" data-id="${s.id}"><div class="th ${s.img?'':'txt'}">${s.img?`<img src="${s.src}" alt="">`:'&ldquo;'+esc(s.text.slice(0,70))+'&hellip;&rdquo;'}</div><div class="body"><span class="eyebrow">${s.unit} &middot; ${s.img?'visual':'written'}</span><b>${esc(s.caption.split(',')[0])}</b>${done[s.id]?`<span class="done">&#10003; ${done[s.id].mc}/4 quick &middot; self-mark ${done[s.id].self??'–'}/3</span>`:''}</div></button>`).join('')}</div>
 <p class="foot">Sources are public domain, from Wikimedia Commons. Written extracts are adapted and shortened, as they would be in an exam.</p>`;
 app.querySelectorAll('.st').forEach(b=>b.onclick=()=>one(D.sources.find(s=>s.id===b.dataset.id)));
 window.scrollTo(0,0);
}
function one(s){
 clearInterval(tick); let mc=0, answered=0;
 app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn quiet" id="back">&larr; All sources</button><span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)">${s.unit} &middot; ${s.img?'visual source':'written source'}</span></div>
 <div class="src">${s.img?`<div><img src="${s.src}" alt=""></div>`:`<blockquote>${esc(s.text)}</blockquote>`}<div><p class="cap"><b>Source.</b> ${esc(s.caption)}</p><p class="cap" style="margin-top:10px">Read the caption first. It tells you the type, who made it, where and when. Then answer the four quick questions, then write.</p></div></div>
 ${s.qs.map((q,i)=>`<div class="qq" data-i="${i}"><h3>${i+1}. ${esc(q.q)}</h3><div class="opts">${shuffle(q.o.map((o,k)=>({o,k}))).map(({o,k})=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="x">${esc(q.x)}</div></div>`).join('')}
 <div class="wr" id="wr"><p class="q">${esc(s.write)} <span style="color:var(--muted);font-size:14px">(3 marks)</span></p>
  <div class="row"><button class="btn primary" id="start">Start writing (2 min 15 s)</button><span class="timer" id="td">2:15</span><span class="sub" style="margin:0;font-size:13px">45 seconds a mark, like the exam.</span></div>
  <ul class="chk">${D.checklist.map(c=>`<li>${c}</li>`).join('')}</ul>
  <textarea id="ta" placeholder="Start with the source: 'The source shows…' or 'The writer says…', then 'which suggests…'" disabled></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="reveal" disabled>Reveal a full-marks answer</button></div>
  <div class="model" id="model"><h4>A 3-mark answer</h4><p style="margin:0">${esc(s.model)}</p><ol>${s.mark.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>
   <div class="self"><label>Mark yourself honestly: <select id="self"><option value="">–</option><option>0</option><option>1</option><option>2</option><option>3</option></select> / 3</label></div></div>
  <div class="row" style="margin-top:16px"><button class="btn" id="next">Next source</button><button class="btn quiet" id="back2">All sources</button></div>
 </div>`;
 const $=q=>app.querySelector(q);
 $('#back').onclick=list;
 app.querySelectorAll('.qq').forEach(box=>{const i=+box.dataset.i; box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k, ok=k===s.qs[i].a; if(ok) mc++; answered++;
  box.querySelectorAll('.opt').forEach(o=>{o.disabled=true; if(+o.dataset.k===s.qs[i].a) o.classList.add('ok')}); if(!ok) b.classList.add('no');
  box.querySelector('.x').classList.add('show');
  if(answered===s.qs.length){ $('#wr').classList.add('show'); $('#wr').scrollIntoView({behavior:'smooth',block:'start'}); }
 })});
 $('#start').onclick=()=>{ $('#start').disabled=true; $('#ta').disabled=false; $('#ta').focus(); $('#reveal').disabled=false; let t=135; const td=$('#td');
  tick=setInterval(()=>{t--; td.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); if(t<=20) td.classList.add('low'); if(t<=0){clearInterval(tick); $('#ta').disabled=true; td.textContent='Pens down'; }},1000) };

 $('#self').onchange=e=>{ done[s.id]=Object.assign(done[s.id]||{mc},{self:e.target.value}); save() };
 $('#next').onclick=()=>{const i=D.sources.indexOf(s); one(D.sources[(i+1)%D.sources.length])}; $('#back2').onclick=list;
 window.scrollTo(0,0);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
list();
</script></body></html>
