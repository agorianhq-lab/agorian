name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content files
        run: python3 tools/validate.py
      - name: Build and confirm docs/ is up to date
        run: |
          python3 build.py
          git diff --exit-code -- docs/ || (echo "docs/ is stale: run python3 build.py and commit the result" && exit 1)
